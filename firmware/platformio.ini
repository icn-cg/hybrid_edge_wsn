[platformio]
default_envs = native

; This environment exercises only board-independent protocol/configuration logic.
[env:native]
platform = native
test_framework = custom
build_src_filter = -<*>
lib_ldf_mode = deep+
build_flags =
    -std=c++17
    -Wall
    -Wextra
    -Werror

; Do not add an ESP32 environment until the exact board is identified. Then add:
;
; [env:physical-node]
; platform = espressif32
; board = <confirmed-platformio-board-id>
; framework = arduino
; monitor_speed = 115200
; lib_deps =
;     adafruit/Adafruit BME280 Library@^2.3.0
