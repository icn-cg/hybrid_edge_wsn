[platformio]
default_envs = native

; This environment exercises only board-independent protocol/configuration logic.
[env:native]
platform = native
test_framework = custom
build_src_filter = -<*>
lib_ldf_mode = deep+
build_flags =
    -std=c++17
    -Wall
    -Wextra
    -Werror

[env:physical-node]
platform = espressif32@7.0.1
board = esp32doit-devkit-v1
framework = arduino
monitor_speed = 115200
platform_packages =
    platformio/framework-arduinoespressif32@3.20017.241212
build_unflags = -std=gnu++11
build_flags =
    -std=gnu++17
    ; Retained bring-up diagnostics; temporarily set either value to 1 when needed.
    -DWIFI_BRINGUP_SCAN_ON_BOOT=0
    -DWIFI_BRINGUP_REASON_DIAGNOSTIC=0
lib_deps =
    adafruit/Adafruit BME280 Library@2.3.0
